          title: Effort Level
          description: Level of effort for extraction. 'standard' uses cheaper/faster models (default), 'high' uses the best models.
          default: standard
        citations:
          type: boolean
          title: Citations
          description: 'If true, every extracted value is cited to its place on the page: fieldMetadata carries a bounding box and a confidence (high / medium / low) per field, and a Review object is created for the standardization. Runs at standard effort (effortLevel is ignored) and costs 1 extra credits per page.'
