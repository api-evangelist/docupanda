        transformationIds:
          items:
            type: string
          type: array
          title: Transformation IDs
          description: Transformations to apply, in order, to each finished standardization. The result is stored as transformedData next to the original data, and each run costs 1 credit.
        timeout:
          type: integer
          title: Timeout
          description: The job timeout (in seconds) for webhook error reporting
      type: object
      required:
      - documentId
      title: StandardizeV3Request
