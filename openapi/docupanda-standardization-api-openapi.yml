          type: string
          title: Document ID
          description: Unique identifier of the document to be standardized.
        schemaId:
          type: string
          title: Schema ID
          description: Schema to use for standardization. If omitted, a draft schema is auto-generated from the document, costing 1 credit per page on at most the first 5 pages in addition to standardization credits.
        guidelines:
          type: string
          title: Guidelines
          description: Extraction guidelines. Overrides schema guidelines. Without a schemaId, also used as instructions for the draft schema.
        useMetadata:
          type: boolean
          title: Use Metadata
          description: Whether to use metadata during standardization.
          default: false
        pages:
          items:
            type: integer
          type: array
          title: Pages
          description: Optional list of zero indexed page numbers to standardize. If omitted, the entire document is standardized. For XLS/XLSX files, each number selects a worksheet by its zero indexed position. Page targeting is ignored for CSV, TXT, XML, and JSON files, which are always standardized in full.
          examples:
          - - 0
            - 1
            - 5
        stdVersion:
          $ref: '#/components/schemas/StdVersionV3'
          title: Standardization Version
          description: Version of the standardization job.
