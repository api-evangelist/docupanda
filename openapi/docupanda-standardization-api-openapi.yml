openapi: 3.2.0
info:
  title: DocuPipe Standardization API
  version: '1.0'
servers:
- url: https://app.docupipe.ai
tags:
- name: Standardization
paths:
  /enterprise/matching:
    post:
      tags:
      - Standardization
      summary: Match a standardization to a list of candidates
      description: Use this endpoint to match a standardization to a list of candidates. You can provide a standardization id and a list of candidates. A candidate must have and id and a record which details all its properties. You can optionally provide instructions to clarify the task rules
      operationId: match_standardization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /extractions:
    get:
      summary: List Extractions
      description: Retrieve standardization and reasoning extraction results in one list. Each result includes zero or more source document IDs, extracted data, and reasoning text when the result came from a reasoning operation.
      operationId: list_extractions
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: extraction_id
        in: query
        required: false
        schema:
          type: string
          description: The extraction ID to retrieve
          title: Extraction Id
        description: The extraction ID to retrieve
      - name: schema_id
        in: query
        required: false
        schema:
          type: string
          description: The schema ID to filter extractions by
          title: Schema Id
        description: The schema ID to filter extractions by
      - name: document_id
        in: query
        required: false
        schema:
          type: string
          description: The source document ID to filter extractions by
          title: Document Id
        description: The source document ID to filter extractions by
      - name: extraction_type
        in: query
        required: false
        schema:
          type: string
          description: Filter by standardization or reasoning
          title: Extraction Type
        description: Filter by standardization or reasoning
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: The maximum number of extractions to return. Maximum is 1000
          default: 20
          title: Limit
        description: The maximum number of extractions to return. Maximum is 1000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          description: The number of extractions to skip
          default: 0
          title: Offset
        description: The number of extractions to skip
      - name: exclude_payload
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to exclude the data payload in the response
          default: false
          title: Exclude Payload
        description: Whether to exclude the data payload in the response
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Extraction'
                title: Response List Extractions Extractions Get
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Standardization
  /query:
    post:
      tags:
      - Standardization
      summary: Query Standardizations
      description: Query the documents you have standardized using free form language.The query should be written in plain language, and should describe what you're looking for. e.g "Find all the documents where the rental is above $1000 in San Francisco". The endpoint will return a list of standardizations that match the query, along with AI-generated feedback on the query. The maximum number of standardizations returned is 200.
      operationId: post_query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /standardization/download/bulk-excel:
    post:
      tags:
      - Standardization
      summary: Bulk Download Standardization Excels
      description: Download multiple standardization results as Excel files in a single zip archive. Provide a list of standardization IDs and receive a presigned URL to download a zip file containing all the Excel files. Maximum 50 standardizations per request. The download URL expires after 24 hours.
      operationId: bulk_excel_download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkExcelDownloadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /standardization/download/bulk-xml:
    post:
      tags:
      - Standardization
      summary: Bulk Download Standardization XMLs
      description: Download multiple standardization results as XML files in a single zip archive. Provide a list of standardization IDs and receive a presigned URL to download a zip file containing all the XML files. Maximum 100 standardizations per request. The download URL expires after 24 hours.
      operationId: bulk_xml_download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkXmlDownloadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /standardization/download/merged-excel:
    post:
      tags:
      - Standardization
      summary: Download Merged Standardization Excel
      description: Merge multiple standardization results into a single Excel file. Scalar fields become one row per document, array fields are concatenated across all documents. A filename column identifies which document each row came from (docupipe_filename if the schema already has a filename field). Rows follow the order of standardizationIds in the request. Maximum 500 standardizations per request. The download URL expires after 24 hours.
      operationId: merged_excel_download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergedExcelDownloadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /standardization/{standardization_id}:
    get:
      summary: Retrieve a Standardization JSON
      operationId: get_standardization
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: standardization_id
        in: path
        required: true
        schema:
          type: string
          title: Standardization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standardization'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Retrieve the standardization results of a document as a JSON object.
      tags:
      - Standardization
    delete:
      summary: Delete a Standardization
      description: Delete a standardization by providing the standardization ID.
      operationId: delete_standardization
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: standardization_id
        in: path
        required: true
        schema:
          type: string
          title: Standardization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Standardization
  /standardization/{standardization_id}/download/excel-url:
    get:
      summary: Download Excel URL
      description: Generate an Excel file from the standardization JSON by providing a standardization ID. All arrays in the JSON will be put in a separate sheet, and all the non-array fields will be put in the main sheet. Returns a presigned URL to download the Excel file. This URL is valid for a limited time (e.g., 1 hour) and allows secure access to the Excel file stored on DocuPipe.
      operationId: download_excel_url
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: standardization_id
        in: path
        required: true
        schema:
          type: string
          title: Standardization Id
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          description: Number of hours the URL should be valid for
          default: 6
          title: Hours
        description: Number of hours the URL should be valid for
      - name: transformed
        in: query
        required: false
        schema:
          type: boolean
          description: Export the transformed result instead of the extraction, with columns in its own key order
          default: false
          title: Transformed
        description: Export the transformed result instead of the extraction, with columns in its own key order
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      tags:
      - Standardization
  /standardization/{standardization_id}/pdf:
    get:
      summary: Retrieve a Standardization as PDF
      operationId: get_standardization_pdf
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: standardization_id
        in: path
        required: true
        schema:
          type: string
          title: Standardization Id
      responses:
        '200':
          description: PDF rendering of the standardization
          content:
            application/json:
              schema: {}
            application/pdf: {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Retrieve the standardization results of a document as a printable PDF. Renders the same content as the plaintext export with section headers, bold field names, and bullet lists, suitable for downloading as a `.pdf` that a non-technical user can read or import into a downstream system without parsing JSON.
      tags:
      - Standardization
  /standardization/{standardization_id}/text:
    get:
      summary: Retrieve a Standardization as Plaintext
      operationId: get_standardization_text
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: standardization_id
        in: path
        required: true
        schema:
          type: string
          title: Standardization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardizationText'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Retrieve the standardization results of a document as a human-readable plaintext document. Field names are converted from camelCase to space-separated title case, null values are skipped, primitive arrays render as bullet lists, and object arrays render as separated indented blocks. Useful for downloading the extraction as a `.txt` file that a non-technical user can read directly without parsing JSON.
      tags:
      - Standardization
  /standardization/{standardization_id}/xml:
    get:
      summary: Retrieve a Standardization XML
      operationId: get_standardization_xml
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: standardization_id
        in: path
        required: true
        schema:
          type: string
          title: Standardization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardizationXml'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Retrieve the standardization results of a document as an XML object.
      tags:
      - Standardization
  /standardizations:
    get:
      summary: List Standardizations
      description: Retrieve all standardizations of documents that have been processed using a specific schema.
      operationId: list_standardizations
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: schema_id
        in: query
        required: false
        schema:
          type: string
          description: The schema ID to filter standardizations by
          title: Schema Id
        description: The schema ID to filter standardizations by
      - name: document_id
        in: query
        required: false
        schema:
          type: string
          description: The ID of the document to filter standardizations by
          title: Document Id
        description: The ID of the document to filter standardizations by
      - name: dataset
        in: query
        required: false
        schema:
          type: string
          description: The dataset name to filter standardizations by
          title: Dataset
        description: The dataset name to filter standardizations by
      - name: standardization_ids
        in: query
        required: false
        schema:
          type: string
          description: Comma-separated standardization IDs to fetch. Returns exactly the requested standardizations that exist (an unknown or still-processing ID is simply absent). Maximum 1000 IDs.
          title: Standardization Ids
        description: Comma-separated standardization IDs to fetch. Returns exactly the requested standardizations that exist (an unknown or still-processing ID is simply absent). Maximum 1000 IDs.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: The maximum number of standardizations to return. Maximum is 1000
          default: 20
          title: Limit
        description: The maximum number of standardizations to return. Maximum is 1000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          description: The number of standardizations to skip (to paginate through the data)
          default: 0
          title: Offset
        description: The number of standardizations to skip (to paginate through the data)
      - name: exclude_payload
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to exclude the data payload in the response
          default: true
          title: Exclude Payload
        description: Whether to exclude the data payload in the response
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Standardization'
                title: Response List Standardizations Standardizations Get
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Standardization
    delete:
      summary: Delete Multiple Standardizations
      description: Delete multiple standardizations at once by providing a list of standardization IDs.
      operationId: delete_standardizations
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteStandardizationsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Standardization
  /standardizations/merge:
    post:
      tags:
      - Standardization
      summary: Merge Standardizations
      description: 'Combine several standardizations into a single new standardization on a target document.


        This exists for split documents. A long file is split into children, each child is standardized on its own so they process in parallel, and this call reassembles them into one result on the parent document - so anything downstream sees one extraction per source file rather than one per child.


        List fields are concatenated in the order the standardization ids are supplied, so pass them in page order. Non-list fields take the first non-null value. Where the children were standardized against different schemas, the merged standardization records the most common one.


        The result is a new standardization, retrievable and transformable like any other; the originals are left untouched.


        No extraction runs, so the cost is a flat 1 credit per call regardless of how many standardizations are merged or how many rows they hold.'
      operationId: post_merge_standardizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeStandardizationsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeStandardizationsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /standardizations/search:
    get:
      summary: Search Standardizations
      description: Search standardizations by filename, document ID, or standardization ID using case-insensitive partial matching. You can optionally filter results by schema ID or dataset name.
      operationId: search_standardizations
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 50
          description: Search query to match against filename, document ID, or standardization ID
          title: Query
        description: Search query to match against filename, document ID, or standardization ID
      - name: schema_id
        in: query
        required: false
        schema:
          type: string
          description: Optional schema ID filter
          title: Schema Id
        description: Optional schema ID filter
      - name: dataset
        in: query
        required: false
        schema:
          type: string
          description: Optional dataset filter
          title: Dataset
        description: Optional dataset filter
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Maximum number of results to return (1-500)
          default: 100
          title: Limit
        description: Maximum number of results to return (1-500)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of results to skip for pagination
          default: 0
          title: Offset
        description: Number of results to skip for pagination
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Standardization'
                title: Response Search Standardizations Standardizations Search Get
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Standardization
  /standardizations/summary:
    get:
      tags:
      - Standardization
      summary: Get Standardization Count
      description: Get a count of your standardizations, including the total number as well as the list of unique schema names
      operationId: get_standardization_summary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardizationSummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /v2/standardize/batch:
    post:
      tags:
      - Standardization
      summary: Standardize V2 (Legacy)
      description: 'Standardize a batch documents, either by passing a list of Document IDs or by passing a dataset name. Pass a schemaId to standardize the documents using a specific structure, or leave it empty to create an ad-hoc structure as the AI sees fit. Standardization handles lists (arrays) by splitting documents into smaller sub-documents behind the scenes - the AI will do its best to decide how and when it is appropriate to split.


        You can specify certain parameters, by default they are left to `auto` which lets the AI decide.

        1. `displayMode` - Controls how the AI sees the document. The options are:

        - `auto` - Automatically determine the best mode based on the document content.

        - `spatial` - Represent text in the document according to its spatial layout.

        - `sections` - Represent the document as a list of sections (paragraphs, tables, images, etc.) as seen in the web UX.

        2. `splitMode` - Controls how the AI splits the document into sub-documents. The options are:

        - `auto` - Automatically determine the best mode based on the document content.

        - `all` - Split the document into single-page sub-documents, so each page is handled separately.

        - `never` - Do not split the document at all, so the entire document is handled as a single unit. This can lead to poor performance for long documents, or documents with lots of dense data that needs to be extracted.

        3. `effortLevel` - Controls how much effort the AI puts into the standardization. The options are:

        - `standard` - Use the standard effort level.

        - `high` - Use the high effort level, which takes longer but can produce better results. Costs +2 credits per page.


        **Note:** The `guidelines` field has a maximum length of 50,000 characters.'
      operationId: post_standardize_batch_v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardizeV2BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardizeBatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /v3/convert/excel:
    post:
      tags:
      - Standardization
      summary: Convert to Excel
      description: 'Convert a document into an Excel file. Send a `documentId` and, optionally, free-text `instructions` on what the spreadsheet should contain. DocuPipe lays out a workbook for the document (one sheet per table, with the document''s own column headers, plus a Document sheet for values that appear once), extracts the data, and stores the file.


        The call returns right away with a `conversionId`. Poll `GET /v3/convert/excel/{conversionId}` until `status` is `completed`, then download the file from `excelUrl`.


        Costs 2 credits per page, the same as a standard-effort standardization. Laying out the workbook costs nothing extra.


        - `documentId` - The uploaded document to convert.

        - `instructions` - Optional. What the spreadsheet should contain, for example which tables or columns to keep.

        - `pages` - Optional list of 0-indexed page numbers to convert. If not provided, the whole document is converted.

        - `schemaId` - Optional. The `schemaId` returned by an earlier conversion. Reusing it gives the same sheets and columns for similar files.'
      operationId: post_convert_excel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertExcelRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertExcelResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /v3/convert/excel/{conversion_id}:
    get:
      summary: Get Excel Conversion
      operationId: get_convert_excel
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: conversion_id
        in: path
        required: true
        schema:
          type: string
          title: Conversion Id
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          description: Hours the download link stays valid
          default: 6
          title: Hours
        description: Hours the download link stays valid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertExcelResult'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      description: Get the status of an Excel conversion. While it runs, `status` is `generating_schema`, `extracting` or `exporting`. Once it is `completed`, `excelUrl` links to the .xlsx file and `preview` lists each sheet with its headers and first rows. The link expires after `hours` (default 6); request the status again for a fresh link. A `failed` conversion carries an `errorMessage`.
      tags:
      - Standardization
  /v3/standardize:
    post:
      tags:
      - Standardization
      summary: Standardize V3
      description: 'Standardize a single document using the V3 agentic engine. V3 uses an agentic architecture that automatically determines the optimal extraction strategy for each document - no manual configuration of display modes, split modes, or effort levels needed.


        Unlike V2, this endpoint processes a single document per call. To standardize multiple documents, fire parallel requests.


        If no `schemaId` is provided, a draft schema is first generated from the document, using `guidelines` (if sent) as instructions, then the document is standardized against it. The generated schema''s ID is returned in the response''s `schemaId` field. Generating the draft costs 1 credit per page on at most the first 5 pages, in addition to the standardization credits.


        - `schemaId` - Optional schema to standardize against. If omitted, a draft schema is auto-generated from the document.

        - `pages` - Optional list of 0-indexed page numbers to standardize. If not provided, the entire document is standardized.

        - `guidelines` - Optional extraction guidelines. They replace the schema''s saved guidelines for this call. Without a `schemaId`, they also steer the draft schema.

        - `useMetadata` - Whether to include document metadata during extraction (default: false).

        - `effortLevel` - `standard` (default) uses faster models, `high` uses the best models for better results at +2 credits per page.


        **Note:** The `guidelines` field has a maximum length of 50,000 characters.'
      operationId: post_standardize_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardizeV3Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardizeV3Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
