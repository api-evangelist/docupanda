openapi: 3.2.0
info:
  title: DocuPipe Job API
  version: '1.0'
servers:
- url: https://app.docupipe.ai
tags:
- name: Job
paths:
  /job/{job_id}:
    get:
      summary: Retrieve a Job
      operationId: get_job
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/JobDocumentUpload'
                - $ref: '#/components/schemas/JobStandardize'
                - $ref: '#/components/schemas/JobStandardizeBatch'
                - $ref: '#/components/schemas/JobAnalyzeDocument'
                - $ref: '#/components/schemas/JobAnalyzeData'
                - $ref: '#/components/schemas/JobSplit'
                - $ref: '#/components/schemas/JobMerge'
                - $ref: '#/components/schemas/JobClassify'
                - $ref: '#/components/schemas/JobClassifyBatch'
                - $ref: '#/components/schemas/JobCreateSchema'
                - $ref: '#/components/schemas/JobDuplicateSchema'
                - $ref: '#/components/schemas/JobAutogenerateSchema'
                - $ref: '#/components/schemas/JobImproveSchema'
                - $ref: '#/components/schemas/JobImproveSchemaGenerate'
                - $ref: '#/components/schemas/JobQuery'
                - $ref: '#/components/schemas/JobReview'
                - $ref: '#/components/schemas/JobRedact'
                - $ref: '#/components/schemas/JobMatching'
                - $ref: '#/components/schemas/JobReasoning'
                - $ref: '#/components/schemas/JobTransformationAuthoring'
                - $ref: '#/components/schemas/JobTransformation'
                - $ref: '#/components/schemas/JobWorkflowV2Run'
                - $ref: '#/components/schemas/JobArchitectSession'
                title: Response Get Job Job  Job Id  Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      description: Retrieve the details of a specific job by providing the job's ID. This will include the job's status, timestamp, and any other relevant information.
      tags:
      - Job
  /jobs:
    delete:
      summary: Delete Jobs
      description: Delete multiple jobs that have been submitted to DocuPipe for processing. You can provide a list of job IDs to delete multiple jobs at once. Since jobs are just a record of events, deleting them will just hide them from you - the actual records will still be stored in the database. For specific jobs that contain actual data, such as Analyze-Document, the data will be deleted.
      operationId: delete_jobs
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteJobsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Job
    get:
      summary: List Jobs
      operationId: list_jobs
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          title: End Date
      - name: status
        in: query
        required: false
        schema:
          type: string
          title: Status
      - name: job_type
        in: query
        required: false
        schema:
          type: string
          title: Job Type
      - name: schema_id
        in: query
        required: false
        schema:
          type: string
          title: Schema Id
      - name: document_id
        in: query
        required: false
        schema:
          type: string
          title: Document Id
      - name: new_document_id
        in: query
        required: false
        schema:
          type: string
          title: New Document Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
                title: Response List Jobs Jobs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: List all jobs that have been submitted to DocuPipe for processing. Every document upload, standardization, or credit-consuming event results in a job. This lets you audit your credit consumption. You can optionally filter the results by providing a date range in the format yyyy-mm-dd.
      tags:
      - Job
  /jobs/summary:
    get:
      summary: Get Job Count
      description: 'Get a count of your jobs broken down by Job Type. For each job type, you will see the number of jobs and number of credits consumed. The output includes 4 versions of the summary:

        1. All time summary with deleted jobs

        2. All time summary excluding deleted jobs

        3. Count since start_date (defaults to previous billing date, includes deleted jobs)

        4. Daily breakdown of credit usage, additionally broken down by job type. To receive this, set include_daily_usage to true.


        You may pass start_date as an optional query parameter in ISO format (yyyy-mm-dd), and include_daily_usage as a boolean flag.'
      operationId: get_job_summary
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: include_daily_usage
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Daily Usage
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummary'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Job
  /jobs/wait:
    post:
      tags:
      - Job
      summary: Wait For Jobs
      description: 'Block until every supplied job has finished, or until maxWaitSeconds elapses - whichever comes first.


        This is a convenience for automations that would otherwise poll in a loop. Submit the job ids you are waiting on and the call returns as soon as they are all finished.


        **A timeout is not an error.** If the jobs are still running when the wait elapses, the call still returns 200 with `allComplete: false` and the current status of each job - simply call again with the ids that are still processing.


        `allComplete` is true once every job has reached a terminal state, whether completed or error. Check `anyError` to tell the two apart. Unknown job ids come back with a null status rather than failing the whole request.


        This endpoint consumes no credits.'
      operationId: wait_for_jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobWaitRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobWaitResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
components:
  schemas:
    Orientation:
      type: string
      enum:
      - normal
      - clockwise
      - counter_clockwise
      - upside_down
      title: Orientation
    DisplayMode:
      type: string
      enum:
      - auto
      - spatial
      - sections
      - image
      title: DisplayMode
    JobTransformation:
      properties:
        jobId:
          type: string
          title: Job ID
          description: Unique identifier of the job.
        jobType:
          type: string
          title: Jobtype
          default: transformation
        documentId:
          type: string
          title: Document ID
          description: Unique identifier of the document.
        filename:
          type: string
          title: Filename
          description: Name of the document the job ran on.
        dataset:
          type: string
          title: Dataset
          description: Name of the dataset the document belongs to.
        credits:
          type: number
          title: Credits
          description: Number of credits used by the operation.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
          title: Processing Status
          description: Current status of the job.
        errorMessage:
          type: string
          title: Error Message
          description: Error message if the job failed.
        processingTime:
          type: number
          title: Processing Time
          description: Processing time in seconds.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Timestamp of the job creation.
        progress:
          type: integer
          title: Progress
          description: Job progress percentage (0-100). Used by document upload parsing and V3 standardization jobs.
        source:
          type: string
          enum:
          - standardization
          - document
          title: Source
          description: Whether the transformations ran on a standardization or a document.
          default: standardization
        standardizationId:
          type: string
          title: Standardization ID
          description: The standardization that was transformed.
        transformationIds:
          items:
            type: string
          type: array
          title: Transformation IDs
          description: The transformations run, in order.
        applied:
          type: boolean
          title: Applied
          description: Whether the transformations ran to completion. False when the transformation code raised an error.
          default: false
      type: object
      required:
      - jobId
      - status
      title: JobTransformation
    JobRedact:
      properties:
        jobId:
          type: string
          title: Job ID
          description: Unique identifier of the job.
        jobType:
          type: string
          title: Jobtype
          default: redact
        documentId:
          type: string
          title: Source Document ID
        filename:
          type: string
          title: Filename
          description: Name of the document the job ran on.
        dataset:
          type: string
          title: Dataset
          description: Name of the dataset the document belongs to.
        credits:
          type: number
          title: Credits
          description: Number of credits used by the operation.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
          title: Processing Status
          description: Current status of the job.
        errorMessage:
          type: string
          title: Error Message
          description: Error message if the job failed.
        processingTime:
          type: number
          title: Processing Time
          description: Processing time in seconds.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Timestamp of the job creation.
        progress:
          type: integer
          title: Progress
          description: Job progress percentage (0-100). Used by document upload parsing and V3 standardization jobs.
        guidelines:
          type: string
          title: Guidelines
        language:
          type: string
          title: Language
        page:
          type: integer
          title: Page Number
        redactionId:
          type: string
          title: Redaction ID
        redactedDocumentId:
          type: string
          title: Redacted Document ID
        redactedDocumentParseJobId:
          type: string
          title: Redacted Document Parse Job ID
        numRedactions:
          type: integer
          title: Number of Redactions
      type: object
      required:
      - jobId
      - documentId
      - status
      title: JobRedact
    JobSplit:
      properties:
        jobId:
          type: string
          title: Job ID
          description: Unique identifier of the job.
        jobType:
          type: string
          title: Jobtype
          default: split
        documentId:
          type: string
          title: Document ID
        filename:
          type: string
          title: Filename
          description: Name of the document the job ran on.
        dataset:
          type: string
          title: Dataset
        credits:
          type: number
          title: Credits
          description: Number of credits used by the operation.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
          title: Processing Status
          description: Current status of the job.
        errorMessage:
          type: string
          title: Error Message
          description: Error message if the job failed.
        processingTime:
          type: number
          title: Processing Time
          description: Processing time in seconds.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Timestamp of the job creation.
        progress:
          type: integer
          title: Progress
          description: Job progress percentage (0-100). Used by document upload parsing and V3 standardization jobs.
        numNewDocuments:
          type: integer
          title: Number of New Documents
        newDocumentIds:
          items:
            type: string
          type: array
          title: New Document IDs
        details:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Details
        instructions:
          type: string
          title: Instructions
        displayMode:
          $ref: '#/components/schemas/DisplayMode'
          title: Display Mode
        splitVersion:
          $ref: '#/components/schemas/SplitVersion'
          title: Split Version
          description: 'Version of the split behavior. Supported values: 1.0, 1.1, 1.2.'
        filenamePrefix:
          type: string
          title: Filename Prefix
      type: object
      required:
      - jobId
      - documentId
      - status
      title: JobSplit
    JobMatching:
      properties:
        jobId:
          type: string
          title: Job ID
          description: Unique identifier of the job.
        jobType:
          type: string
          title: Jobtype
          default: matching
        documentId:
          type: string
          title: Document ID
          description: Unique identifier of the document.
        filename:
          type: string
          title: Filename
          description: Name of the document the job ran on.
        dataset:
          type: string
          title: Dataset
          description: Name of the dataset the document belongs to.
        credits:
          type: number
          title: Credits
          description: Number of credits used by the operation.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
          title: Processing Status
          description: Current status of the job.
        errorMessage:
          type: string
          title: Error Message
          description: Error message if the job failed.
        processingTime:
          type: number
          title: Processing Time
          description: Processing time in seconds.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Timestamp of the job creation.
        progress:
          type: integer
          title: Progress
          description: Job progress percentage (0-100). Used by document upload parsing and V3 standardization jobs.
        standardizationId:
          type: string
          title: Standardization ID
        matchCandidates:
          items:
            type: string
          type: array
          title: Matching Candidates
        instructions:
          type: string
          title: Instructions
        client:
          type: string
          title: Client
      type: object
      required:
      - jobId
      - status
      - standardizationId
      - matchCandidates
      title: JobMatching
    WorkflowV2StandardizationOutputItem:
      properties:
        documentId:
          type: string
          title: Documentid
          description: Source document for this extraction.
        standardizationId:
          type: string
          title: Standardizationid
          description: Created standardization id.
        data:
          additionalProperties: true
          type: object
          title: Data
          description: Extracted data when small enough to inline.
        dataTooBig:
          type: boolean
          title: Datatoobig
          description: True when the caller should fetch the standardization by id.
      type: object
      required:
      - documentId
      - standardizationId
      title: WorkflowV2StandardizationOutputItem
    JobImproveSchemaGenerate:
      properties:
        jobId:
          type: string
          title: Job ID
          description: Unique identifier of the job.
        jobType:
          type: string
          title: Jobtype
          default: improve-schema-generate
        documentId:
          type: string
          title: Document ID
        filename:
          type: string
          title: Filename
          description: Name of the document the job ran on.
        dataset:
          type: string
          title: Dataset
          description: Name of the dataset the document belongs to.
        credits:
          type: number
          title: Credits
          description: Number of credits used by the operation.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
          title: Processing Status
          description: Current status of the job.
        errorMessage:
          type: string
          title: Error Message
          description: Error message if the job failed.
        processingTime:
          type: number
          title: Processing Time
          description: Processing time in seconds.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Timestamp of the job creation.
        progress:
          type: integer
          title: Progress
          description: Job progress percentage (0-100). Used by document upload parsing and V3 standardization jobs.
        schemaId:
          type: string
          title: Schema ID
        standardizationId:
          type: string
          title: Standardization ID
        newSchemaId:
          type: string
          title: New Schema ID
        instructions:
          type: string
          title: Instructions
      type: object
      required:
      - jobId
      - documentId
      - status
      - schemaId
      - standardizationId
      title: JobImproveSchemaGenerate
    JobWaitStatus:
      properties:
        jobId:
          type: string
          title: Jobid
          description: The job id.
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: processing, completed or error. Null if the job was not found.
        jobType:
          anyOf:
          - type: string
          - type: 'null'
          title: Jobtype
          description: The job type, when known.
        errorMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Errormessage
          description: Populated when status is error.
      type: object
      required:
      - jobId
      title: JobWaitStatus
    JobSummary:
      properties:
        summaryAllTime:
          additionalProperties:
            $ref: '#/components/schemas/JobTypeStats'
          type: object
          title: Summary All Time
          description: Summary of the total number of jobs and credits used by job type (deleted jobs count as well).
        summaryRecent:
          additionalProperties:
            $ref: '#/components/schemas/JobTypeStats'
          type: object
          title: Summary Recent
          description: Summary of the recent (since last billing cycle) number of jobs and credits used by job type.
        totalVisibleJobs:
          type: integer
          title: Total Visible Jobs
          description: Total number of visible jobs (not deleted).
        dailyUsage:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Daily Usage
          description: Daily credit usage broken down by job type.
      type: object
      required:
      - summaryAllTime
      - summaryRecent
      - totalVisibleJobs
      title: JobSummary
    ClassifyVersion:
      type: number
      enum:
      - 1
      - 1.1
      title: ClassifyVersion
    WorkflowV2BlockResult:
      properties:
        blockId:
          type: string
          title: Blockid
          description: Node id this result belongs to.
        status:
          $ref: '#/components/schemas/WorkflowV2BlockStatus'
          description: Last known run status for this node.
        summary:
          type: string
          title: Summary
          description: Short result summary for the run panel.
        details:
          items:
            $ref: '#/components/schemas/WorkflowV2ResultDetail'
          type: array
          title: Details
          description: Optional structured result preview rows.
        stale:
          type: boolean
          title: Stale
          description: Whether this result should be re-run before downstream results are trusted.
      type: object
      required:
      - blockId
      - status
      - summary
      title: WorkflowV2BlockResult
    WorkflowV2RunOutput:
      properties:
        outputType:
          type: string
          enum:
          - extraction
          - redaction
          - reasoning
          title: Outputtype
          description: Which payload field below is populated.
        label:
          type: string
          title: Label
          description: Output label/key from the output node.
        nodeId:
          type: string
          title: Nodeid
          description: Output node id.
        extraction:
          $ref: '#/components/schemas/WorkflowV2StandardizationOutput'
          title: Extraction
          description: Populated when outputType is 'extraction'.
        redaction:
          $ref: '#/components/schemas/WorkflowV2RedactionOutput'
          title: Redaction
          description: Populated when outputType is 'redaction'.
        reasoning:
          $ref: '#/components/schemas/WorkflowV2ReasoningOutput'
          title: Reasoning
          description: Populated when outputType is 'reasoning'.
      type: object
      required:
      - outputType
      - label
      - nodeId
      title: WorkflowV2RunOutput
    EffortLevel:
      type: string
      enum:
      - standard
      - high
      - extended
      title: EffortLevel
    JobTransformationAuthoring:
      properties:
        jobId:
          type: string
          title: Job ID
          description: Unique identifier of the job.
        jobType:
          type: string
          title: Jobtype
          default: transformation-authoring
        documentId:
          type: string
          title: Sample Document ID
          description: The sample structured document, if one was given.
        filename:
          type: string
          title: Filename
          description: Name of the document the job ran on.
        dataset:
          type: string
          title: Dataset
          description: Name of the dataset the document belongs to.
        credits:
          type: number
          title: Credits
          description: Number of credits used by the operation.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
          title: Processing Status
          description: Current status of the job.
        errorMessage:
          type: string
          title: Error Message
          description: Error message if the job failed.
        processingTime:
          type: number
          title: Processing Time
          description: Processing time in seconds.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Timestamp of the job creation.
        progress:
          type: integer
          title: Progress
          description: Job progress percentage (0-100). Used by document upload parsing and V3 standardization jobs.
        description:
          type: string
          title: Description
          description: What the transformation should do, as requested.
        basedOnTransformationId:
          type: string
          title: Based On Transformation ID
          description: The transformation being changed, when this request changes one.
        standardizationId:
          type: string
          title: Sample Standardization ID
          description: The sample standardization, if one was given.
        stage:
          type: string
          enum:
          - writing
          - testing
          - reviewing
          title: Stage
          description: 'What the job is doing while it runs: writing the code, testing it on the sample, or reviewing it.'
        attempts:
          type: integer
          title: Attempts
          description: How many times the code has been written so far; above 1 means an earlier attempt failed testing.
          default: 0
        maxAttempts:
          type: integer
          title: Max Attempts
          description: The most attempts the job makes before giving up.
        outcome:
          type: string
          enum:
          - approved
          - rejected
          title: Outcome
          description: 'Set when the job completes: approved (the transformation was saved) or rejected.'
        transformationId:
          type: string
          title: Transformation ID
          description: The saved transformation's ID, set only when approved.
        name:
          type: string
          title: Name
          description: The transformation's name.
        code:
          type: string
          title: Code
          description: The Python code that was reviewed.
        explanation:
          type: string
          title: Explanation
          description: What the code does, in plain words.
        preview:
          title: Preview
          description: The code's output on the sample, when a sample was given and the output fits.
        previewTruncated:
          type: boolean
          title: Preview Truncated
          description: True when the output on the sample was too large to include.
          default: false
        verifications:
          items:
            $ref: '#/components/schemas/JobTransformationReview'
          type: array
          title: Review
          description: The review's verdicts and reasons.
      type: object
      required:
      - jobId
      - status
      - description
      title: JobTransformationAuthoring
    WorkflowV2ReasoningOutput:
      properties:
        extractionId:
          type: string
          title: Extractionid
          description: Persisted reasoning extraction id.
        reasoning:
          type: string
          title: Reasoning
          description: Free-text reasoning result, if configured.
        records:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Records
          description: Structured reasoning records, if configured.
        recordsTooBig:
          type: boolean
          title: Recordstoobig
          description: True when the caller should fetch the extraction by id.
        sourceDocumentIds:
          items:
            type: string
          type: array
          title: Sourcedocumentids
          description: Source documents used as reasoning input.
        sourceStandardizationIds:
          items:
            type: string
          type: array
          title: Sourcestandardizationids
          description: Extraction results used as reasoning input.
      type: object
      title: WorkflowV2ReasoningOutput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobAutogenerateSchema:
      properties:
        jobId:
          type: string
          title: Job ID
          description: Unique identifier of the job.
        jobType:
          type: string
          title: Jobtype
          default: autogenerate-schema
        documentId:
          type: string
          title: Document ID
          description: Unique identifier of the document.
        filename:
          type: string
          title: Filename
          description: Name of the document the job ran on.
        dataset:
          type: string
          title: Dataset
