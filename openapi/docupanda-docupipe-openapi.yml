          default: false
        pages:
          items:
            type: integer
          type: array
          title: Pages
          description: Optional list of zero indexed page numbers to standardize. If omitted, the entire document is standardized. For XLS/XLSX files, each number selects a worksheet by its zero indexed position. Page targeting is ignored for CSV, TXT, XML, and JSON files, which are always standardized in full.
          examples:
