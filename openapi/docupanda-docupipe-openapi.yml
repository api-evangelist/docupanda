    ClassifyStandardizeStep:
      properties:
        classIds:
          items:
            type: string
          type: array
          title: Classids
          description: The ids of the classes to classify the data to. If omitted or empty list, use all classes.
          examples:
          - - classId1
            - classId2
        multiClass:
          type: boolean
          title: Multi-Class
          description: Whether the classification is multi-class or not.
        includeUnknown:
          type: boolean
          title: Include Unknown
          description: Whether to include the 'unknown' class in the classification. Only relevant for if multiClass is false and classIds is not provided.
        instructions:
          type: string
          title: Instructions
          description: Instructions for the AI on how to classify the document.
        classifyVersion:
          $ref: '#/components/schemas/ClassifyVersion'
          title: Classify Version
          description: 'Version of the classify behavior. Supported values: 1.0, 1.1.'
        classToSchema:
          additionalProperties:
            type: string
          type: object
          title: Classtoschema
          description: A mapping of class ID to a schema that we should standardize into. Note that not every class must be mapped to a schema, if you do not wish to standardize certain classes. Any schemas mentioned will trigger a standardize action based on the schemaId provided.
          examples:
          - classId1: schemaId1
            classId2: schemaId2
        stdVersion:
          $ref: '#/components/schemas/StdVersion'
          title: Stdversion
          description: 'The version of the standardization engine. Supported values: [2.0, 2.1, 2.2, 2.3, 3.0, 3.1, 3.2]. This is the only version field you need to set.'
        stdReleaseVersion:
          $ref: '#/components/schemas/StdReleaseVersion'
          description: 'Deprecated - set `stdVersion` instead and this will be inferred automatically (e.g. `stdVersion=3.0` infers release 3). Kept for backwards compatibility. Supported values: [1, 2, 3].'
          deprecated: true
        guidelines:
          type: string
          title: Guidelines
          description: Guidelines for the AI on how to standardize the documents. If omitted, use the schema's guidelines.
        useMetadata:
          type: boolean
          title: Use Metadata
          description: Whether to use metadata during standardization.
        citations:
          type: boolean
          title: Citations
          description: V3 only. If true, every extracted value is cited to its place on the page (bounding box + confidence in fieldMetadata) and a Review object is created per standardization. Runs at standard effort (effortLevel is ignored) and costs 1 extra credits per page.
        displayMode:
          $ref: '#/components/schemas/DisplayMode'
          title: Displaymode
          description: 'The display mode of the standardization. For V1, this is called `standardizationMode`. The options are: `auto`, `spatial`, `sections`.'
        splitMode:
          $ref: '#/components/schemas/SplitMode'
          title: Splitmode
          description: 'The split mode of the standardization. The options are: `auto`, `never`, `all`.'
        effortLevel:
          $ref: '#/components/schemas/EffortLevel'
          title: Effortlevel
          description: 'The effort level of the standardization. The options are: `standard`, `high`.'
        schemaToEffort:
          additionalProperties:
            $ref: '#/components/schemas/EffortLevel'
          type: object
          title: Schematoeffort
          description: Optional per-schema effort override, keyed by schema ID. Keys must appear in `classToSchema`. Any schema not listed here runs at `effortLevel`. Use this when one route needs a heavier read than the rest - e.g. a dense price-matrix schema at `high` while a simple flat-list schema stays at `standard`.
          examples:
          - schemaId1: high
        classifyUseMetadata:
          type: boolean
          title: Classifyusemetadata
          description: Whether to show the document's metadata to the AI during the CLASSIFY step. Separate from `useMetadata`, which governs the standardize step only, so turning one on does not change the other.
        standardizeTimeout:
          type: integer
          title: Standardizetimeout
          description: The timeout in seconds for the standardization operation for webhook error reporting
        pages:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
          title: Pages
          description: Optional per-class page restriction, keyed by classId. Keys must be a subset of `classToSchema` keys. Values are non-empty lists of zero indexed page numbers with no duplicates. Any classId not present in this dict standardizes the full document. Out-of-range pages are silently filtered out at execution time. For XLS/XLSX files, each number selects a worksheet by its zero indexed position. Page targeting is ignored for CSV, TXT, XML, and JSON files, which are always standardized in full.
          examples:
          - classId1:
            - 0
            - 1
      type: object
      required:
      - classToSchema
      title: ClassifyStandardizeStep
