  /workflow/on-submit-document:
    post:
      tags:
      - Workflow
      summary: Create a Workflow
      description: 'Use this endpoint to create a workflow that triggers when a document is submitted.


        The workflow can be configured to either:

        1. Always run the specified schema(s) on the document, set via the `standardizeStep`.

        2. Always run the specified schema(s) on the document, then follow up with a review step, set via the `standardizeReviewStep`. Deprecated: for new workflows, use `standardizeStep` with `citations: true`, which gives the same boxes and confidence in one pass.

        3. Conditionally run one or more schemas based on the document''s `classId`, set via the `classifyStandardizeStep`.

        4. Split the document and standardize each resulting sub-document, set via the `splitStandardizeStep`.

        5. Split the document, classify each resulting sub-document, and standardize based on class-to-schema mappings, set via the `splitClassifyStandardizeStep`.


        Note: You must provide exactly one of these inputs.


        To run the workflow, use the `POST /document` endpoint with the `workflowId` that gets returned from this endpoint.'
      operationId: post_workflow_on_submit_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowOnSubmitDocumentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPostResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /workflow/{workflow_id}:
    delete:
      summary: Delete a Workflow
      description: Delete a workflow by providing the workflow ID.
      operationId: delete_workflow
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
