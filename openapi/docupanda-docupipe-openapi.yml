          $ref: '#/components/schemas/ClassifyStandardizeTransformStep'
          title: Classify, Standardize, and Transform Step
          description: This step behaves exactly like `classifyStandardizeStep`, and additionally applies an ordered list of transformations to each standardization once it is saved, per `schemaToTransformations`. The raw standardization is always saved and reported first; a transformation failure never invalidates it.
        splitStandardizeStep:
          $ref: '#/components/schemas/SplitStandardizeStep'
          title: Split and Standardize Step
          description: This step first runs a split operation on the submitted document, then standardizes every resulting sub-document using all schemas provided in `schemaIds`.
        splitClassifyStandardizeStep:
          $ref: '#/components/schemas/SplitClassifyStandardizeStep'
          title: Split, Classify, and Standardize Step
          description: This step runs a split operation on the submitted document, then classifies each resulting sub-document, and finally standardizes any sub-document whose classification matches a provided class-to-schema mapping.
