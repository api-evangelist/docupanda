          description: Version of the standardization job.
          default: 3.2
        effortLevel:
          $ref: '#/components/schemas/EffortLevelV3'
          title: Effort Level
          description: Level of effort for extraction. 'standard' uses cheaper/faster models (default), 'high' uses the best models.
          default: standard
        citations:
          type: boolean
          title: Citations
          description: 'If true, every extracted value is cited to its place on the page: fieldMetadata carries a bounding box and a confidence (high / medium / low) per field, and a Review object is created for the standardization. Runs at standard effort (effortLevel is ignored) and costs 1 extra credits per page.'
          default: false
        transformationIds:
          items:
            type: string
          type: array
          title: Transformation IDs
          description: Transformations to apply, in order, to each finished standardization. The result is stored as transformedData next to the original data, and each run costs 1 credit.
