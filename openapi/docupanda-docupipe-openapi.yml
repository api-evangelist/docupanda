openapi: 3.1.0
info:
  title: DocuPipe
  version: '1.0'
servers:
- url: https://app.docupipe.ai
paths:
  /account:
    get:
      tags:
      - Account
      summary: Get Account Information
      description: Get information about your account, including the plan name, pricing regime, number of remaining credits, the number of overage credits, and the details of the upcoming invoice.
      operationId: get_account
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /analyses:
    get:
      summary: List Analyses
      operationId: list_analyses
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: The maximum number of analyses to return. maximum is 20
          default: 1000
          title: Limit
        description: The maximum number of analyses to return. maximum is 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          description: The number of analyses to skip (to paginate through the data)
          default: 0
          title: Offset
        description: The number of analyses to skip (to paginate through the data)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Analysis'
                title: Response List Analyses Analyses Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: List all analyses that have been performed.
      tags:
      - Analysis
    delete:
      summary: Delete Multiple Analyses
      description: Delete multiple analyses at once by providing a list of analysis IDs.
      operationId: delete_analyses
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAnalysesRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Analysis
  /analysis/{analysis_id}:
    get:
      summary: Retrieve Analysis
      operationId: get_analysis
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Retrieve an analysis object by providing the analysis ID, which has the questions and answers.
      tags:
      - Analysis
  /analyze/data:
    post:
      tags:
      - Analysis
      summary: Analyze Data
      description: "Analyze multiple documents all at once, either by passing a list of Document IDs or by passing a dataset name. If both are pased, we will use the intersection of the two. Analysis works by passing a list of questions in natural language. If a schemaId is passed, the AI will first use the standardizations of those documents under the provided schema to narrow down which documents are relevant. Only then, it will analyze the documents and provide answers to the questions, along with confidence scores and citations.\nIf a schemaId is not passed, the AI will manually examine all documents, with a limit of 50.\n When schemaId is passed, the AI can optionally also perform database queries for statistical calculations and         answer the questions based on those results."
      operationId: post_analyze_data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeDataRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAnalyzeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /analyze/document:
    post:
      tags:
      - Analysis
      summary: Analyze Document
      description: Analyze a single document by passing a `documentId` and a list of questions in natural language. If the `pages` parameter is provided, the AI will only analyze the specified pages. Poll for the results using the `GET /job/{jobId}` endpoint with the returned jobId.
      operationId: post_analyze_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAnalyzeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /class:
    post:
      tags:
      - Classification
      summary: Add a Class
      description: Add a new class to the taxonomy of classes, including name and description.
      operationId: post_add_class
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassAddRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassObject'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /class/edit:
    post:
      tags:
      - Classification
      summary: Edit a Class
      description: Edit an existing class's name or description. The classId is preserved, so every document, classification job, and workflow that references this class continues to work unchanged. Changing the description affects future classification behavior because the description is passed to the classifier as part of the taxonomy.
      operationId: post_edit_class
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditClassRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditClassResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /class/{class_id}:
    delete:
      summary: Delete a Class
      description: Delete a class from the taxonomy of classes by providing the class ID.
      operationId: delete_class
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          title: Class Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Classification
  /classes:
    get:
      summary: List Classes
      description: List all classes that have been defined in the taxonomy.
      operationId: list_classes
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: include_unknown
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Unknown
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassObject'
                title: Response List Classes Classes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Classification
  /classify/batch:
    post:
      tags:
      - Classification
      summary: Classify Documents
      description: Classify a batch of one or multiple documents all at once by passing a list of document IDs, and an optional list of class IDs to use for classification. If no class IDs are provided, all classes will be used. To use the `unknown` class, either pass its classId ('unknown') or set the includeUnknown flag as True.
      operationId: post_classify_batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyBatchResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /copy/classification:
    post:
      tags:
      - Classification
      summary: Copy a Class to Another Workspace
      description: Duplicate one of your taxonomy classes into a different workspace. Provide the existing classId and the target workspaceId to create a copy with a new classId owned by the destination workspace.
      operationId: post_copy_classification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCopyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassObject'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /dataset-names:
    get:
      tags:
      - Document
      summary: List Dataset Names
      description: List all dataset names for the documents you have submitted so far
      operationId: list_datasets
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatasetsResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document:
    post:
      tags:
      - Document
      summary: Submit a Document for Processing
      description: 'Use this endpoint to submit a document to DocuPipe for processing. You can upload a local file or provide a URL to a remote file. Upon submission, receive a unique `documentId` which you may use to retrieve the document''s results, or apply subsequent workflows on it.


        Max document size is 3000 pages and 3000 MB. Max metadata size is 10KB.


        <Accordion title="Advanced Options" icon="fa-info-circle">You may also provide a `workflowId` to apply a pre-defined workflow to the document.</Accordion>'
      operationId: post_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDocumentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDocumentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document/download/bulk-ocr-url:
    post:
      tags:
      - Document
      summary: Bulk Download OCR PDFs
      description: Download multiple documents as OCR PDFs in a single zip archive. Provide a list of document IDs and receive a presigned URL to download a zip file containing all the OCR PDFs. Maximum 100 documents per request. The download URL expires after 24 hours. Only PDF and image documents are supported.
      operationId: bulk_ocr_download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOcrDownloadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document/download/bulk-original-url:
    post:
      tags:
      - Document
      summary: Bulk Download Original Documents
      description: Download multiple documents as their original files in a single zip archive. Provide a list of document IDs and receive a presigned URL to download a zip file containing all the original files. Maximum 100 documents per request. The download URL expires after 24 hours.
      operationId: bulk_original_download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOriginalDownloadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document/split:
    post:
      tags:
      - Document
      summary: Split a Document
      description: Split a document into multiple documents intelligently using AI. If no splitting is needed, no new documents will be created. Otherwise, the new sub-documents will be automatically generated.
      operationId: post_split_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitJobRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSplitResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document/upload/presigned-url:
    post:
      tags:
      - Document
      summary: Create Presigned Upload URL
      description: Create a short-lived presigned S3 PUT URL for browser uploads. Use the returned `contentType` header when uploading to `putUrl`, then submit `getUrl` to the document processing endpoint.
      operationId: create_presigned_upload_url
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document/{document_id}:
    get:
      summary: Retrieve a Processed Document
      operationId: get_document
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Access the analysis results of your submitted document using this endpoint. The `status` field indicates the document's current processing stage, and the `result` field provides the extracted plain text for AI comprehension, as well as more granular structured information such as bounding boxes for detected tables and text blocks.
      tags:
      - Document
    delete:
      summary: Delete a Document
      description: Delete a document that has been previously submitted to DocuPipe for processing.
      operationId: delete_document
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Document
  /document/{document_id}/detailed:
    get:
      summary: Retrieve Detailed Processing Result
      operationId: get_document_detailed
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDetailedDocumentParsing'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Access the fine grained document parsing result. This representation includes individual word locations on the page, as well as per-page handwriting detection. Available for PDF, image, Word, and HTML documents. Not available for table (xlsx/csv), text, or JSON documents.
      tags:
      - Document
  /document/{document_id}/download/ocr-url:
    get:
      summary: Download OCR URL
      description: Generate an OCR PDF by providing a document ID. This will add the OCR text into a layer on top of the PDF, allowing you to search the PDF by the OCR text. Returns a presigned URL to download the OCR PDF. This URL is valid for a limited time (e.g., 1 hour) and allows secure access to the OCR PDF stored on DocuPipe. Note that this endpoint only works for documents with PDF file types.
      operationId: download_ocr_url
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          description: Number of hours the URL should be valid for
          default: 6
          title: Hours
        description: Number of hours the URL should be valid for
      - name: skip_cache
        in: query
        required: false
        schema:
          type: boolean
          description: Force regeneration of the OCR PDF
          default: false
          title: Skip Cache
        description: Force regeneration of the OCR PDF
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      tags:
      - Document
  /document/{document_id}/download/original-url:
    get:
      summary: Download Original URL
      description: 'Generate and retrieve a presigned URL for accessing a document file by its ID. The URL is valid for a limited time (e.g., 1 hour) and allows secure access to the document stored on DocuPipe. outputFormat options: ''original'' (default) — returns the main file stored on DocuPipe. For documents that were converted during upload (HTML, Word, TIFF, WebP, JP2, XFA), this returns the converted version (PDF/PNG). ''pdf'' — same as original, but for image documents it additionally converts the image to PDF. ''uploaded'' — returns the actual file that was originally uploaded, before any conversion. Falls back to ''original'' behavior for older documents or documents where no conversion occurred.'
      operationId: download_original_url
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          description: Number of hours the URL should be valid for
          default: 6
          title: Hours
        description: Number of hours the URL should be valid for
      - name: format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OutputFormat'
          description: Output format of the document
          default: pdf
        description: Output format of the document
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
