      - APIKeyHeader: []
      - HTTPBearer: []
  /v2/workflow/{workflow_id}/run:
    post:
      summary: Run a Workflow
      operationId: run_workflow_v2
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowV2RunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowV2RunResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      description: "Run a workflow on one or more documents. This call returns immediately with a `jobId`; poll `GET /job/{job_id}` until the job status is `completed`, then read the results off the job's `outputs` field. For production integrations we recommend [webhooks](https://docs.docupipe.ai/reference/webhooks) instead of polling.\n\n## Providing documents\n\nEach entry in `inputs` supplies exactly one document, in one of two ways:\n\n1. `documentId` - reference a document already uploaded and processed in your workspace.\n2. `document` - upload a new file inline (base64 `file` or `url`). The file is parsed first and the workflow runs once parsing completes. The optional parameters `pages`, `dataset`, `metadata`, `parseVersion`, and `processingMethod` apply to inline uploads only and are rejected when combined with `documentId`.\n\n## Matching documents to workflow inputs\n\nA workflow declares one or more named inputs. Each input expects either a **single document** (exactly one)\
        \ or a **document stack** (one or more). How you label your `inputs` entries depends on how many inputs the workflow has:\n\n- **One input** (whether a single document or a stack): `inputLabel` is optional. Every entry you submit is automatically assigned to that input. To fill a stack, just send multiple entries.\n- **Multiple inputs**: every entry **must** set `inputLabel` to the exact label of the workflow input it belongs to. Labels are case-sensitive. Repeat the same label across entries to add several documents to a stack input.\n\nEvery workflow input must receive at least one document, and single-document inputs accept exactly one. Requests that omit a required `inputLabel`, use an unknown label, or leave an input empty are rejected with a `400` error that lists the labels the workflow expects.\n\n### Example: workflow with one input\n\n```json\n{\"inputs\": [{\"documentId\": \"abc123\"}]}\n```\n\n### Example: one stack input, three documents\n\n```json\n{\"inputs\": [\n\
        \  {\"documentId\": \"abc123\"},\n  {\"documentId\": \"def456\"},\n  {\"document\": {\"url\": \"https://example.com/invoice.pdf\"}}\n]}\n```\n\n### Example: multiple inputs, labels required\n\n```json\n{\"inputs\": [\n  {\"inputLabel\": \"contract\", \"documentId\": \"abc123\"},\n  {\"inputLabel\": \"invoices\", \"documentId\": \"def456\"},\n  {\"inputLabel\": \"invoices\", \"documentId\": \"ghi789\"}\n]}\n```\n\n## Reading the results\n\nWhen the job completes, each element of the job's `outputs` is typed by `outputType`. For extraction outputs, `extraction.items` holds one item per document with its `documentId`, `standardizationId`, and inline `data`. When a result is too large to inline, `data` is null; fetch it with `GET /standardization/{standardization_id}`. Redaction outputs use `redaction.items`; each item includes its `redactionId` and authenticated `downloadUrl` for the flattened redacted PDF."
      tags:
      - Workflow
  /v3/convert/excel:
