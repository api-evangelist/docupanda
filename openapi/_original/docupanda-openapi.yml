          title: Reviewed Payload
          description: "An exact copy of the original standardization JSON object, except every value\
            \ is replaced with a dictionary with the following values:\n- **value**: The original value\n\
            - **review**:\n   - **page**: The page number on which the value was found\n   - **confidence**:\
            \ The confidence score of the value extraction\n   - **boundingBox**: The bounding box of\
            \ the value on the page. These will be normalized coordinates 0..1 for the page size, in the\
            \ format x1y1x2y2:\n      - **x1**: The x-coordinate of the top left start of the bounding\
            \ box\n      - **y1**: The y-coordinate of the top left start of the bounding box\n      -\
            \ **x2**: The width of the bottom right of the bounding box\n      - **y2**: The height of\
            \ the bottom right of the bounding box\n"
        schemaId:
          type: string
          title: Schema ID
          description: Unique identifier of the schema used for standardization.
        schemaName:
          type: string
          title: Schema Name
          description: Name of the schema used for standardization.
        jobId:
          type: string
          title: Job ID
          description: Unique identifier of the job that created the standardization.
        dataset:
          type: string
          title: Dataset
