    SplitClassifyStandardizeStep:
      properties:
        classIds:
          items:
            type: string
          type: array
          title: Classids
          description: The ids of the classes to classify the data to. If omitted or empty list, use all
            classes.
          examples:
          - - classId1
            - classId2
        multiClass:
          type: boolean
          title: Multi-Class
          description: Whether the classification is multi-class or not.
          default: false
        includeUnknown:
          type: boolean
          title: Include Unknown
          description: Whether to include the 'unknown' class in the classification. Only relevant for
            if multiClass is false and classIds is not provided.
          default: true
        instructions:
          type: string
          title: Instructions
          description: Instructions for the AI on how to classify the document.
        classToSchema:
          additionalProperties:
            type: string
          type: object
          title: Classtoschema
          description: A mapping of class ID to a schema that we should standardize into. Note that not
            every class must be mapped to a schema, if you do not wish to standardize certain classes.
            Any schemas mentioned will trigger a standardize action based on the schemaId provided.
          examples:
          - classId1: schemaId1
            classId2: schemaId2
        stdVersion:
          $ref: '#/components/schemas/StdVersion'
          title: Stdversion
          description: 'The version of the standardization engine. Supported values: [2.0, 2.1, 2.2, 2.3,
            3.0]. Use 3.0 for the V3 engine. This is the only version field you need to set.'
          default: 3
        stdReleaseVersion:
          $ref: '#/components/schemas/StdReleaseVersion'
          description: 'Deprecated - set `stdVersion` instead and this will be inferred automatically
            (e.g. `stdVersion=3.0` infers release 3). Kept for backwards compatibility. Supported values:
            [1, 2, 3].'
          default: 2
          deprecated: true
        guidelines:
          type: string
          title: Guidelines
          description: Guidelines for the AI on how to standardize the documents. If omitted, use the
            schema's guidelines.
        useMetadata:
          type: boolean
          title: Use Metadata
          description: Whether to use metadata during standardization.
          default: false
        displayMode:
          $ref: '#/components/schemas/DisplayMode'
          title: Displaymode
          description: 'The display mode of the standardization. For V1, this is called `standardizationMode`.
            The options are: `auto`, `spatial`, `sections`.'
          default: auto
        splitMode:
          $ref: '#/components/schemas/SplitMode'
          title: Splitmode
          description: 'The split mode of the standardization. The options are: `auto`, `never`, `all`.'
          default: auto
        effortLevel:
          $ref: '#/components/schemas/EffortLevel'
          title: Effortlevel
          description: 'The effort level of the standardization. The options are: `standard`, `high`.'
          default: standard
        standardizeTimeout:
          type: integer
          title: Standardizetimeout
          description: The timeout in seconds for the standardization operation for webhook error reporting
        pages:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
          title: Pages
          description: 'Optional per-class page restriction, keyed by classId. Keys must be a subset of
            `classToSchema` keys. Values are non-empty lists of 0-indexed page numbers with no duplicates.
            **Indices are interpreted against each sub-document produced by the split, not the original
            uploaded document** - e.g. `{"classId1": [0]}` means the first page of every sub-document
            classified as `classId1`. Any classId not present in this dict standardizes the full sub-document.
            Out-of-range pages are silently filtered out at execution time.'
          examples:
          - classId1:
            - 0
            - 1
        splitInstructions:
          type: string
          title: Splitinstructions
          description: Optional instructions that control how the document is split before classification
            and standardization.
        splitDatasetSuffix:
          type: string
          title: Splitdatasetsuffix
          description: Suffix appended to the dataset provided during upload when assigning sub-documents.
            If the original document has no dataset, this suffix is used as the entire dataset name.
        splitFilenamePrefix:
          type: string
          title: Splitfilenameprefix
          description: Filename prefix to apply to each generated sub-document during the split operation.
        splitDisplayMode:
          $ref: '#/components/schemas/DisplayMode'
          title: Splitdisplaymode
          description: 'Display mode to use when running the split operation. The options mirror the split
            endpoint: `auto`, `spatial`, `sections`, `image`.'
          default: auto
        splitVersion:
          $ref: '#/components/schemas/SplitVersion'
          description: 'Version of the split behavior. Supported values: 1.0, 1.1.'
          default: 1.1
      type: object
      required:
      - classToSchema
      title: SplitClassifyStandardizeStep
