            to only standardize some of the classes, or standardize the same class by multiple schemas.
        splitStandardizeStep:
          $ref: '#/components/schemas/SplitStandardizeStep'
          title: Split and Standardize Step
          description: This step first runs a split operation on the submitted document, then standardizes
            every resulting sub-document using all schemas provided in `schemaIds`.
        splitClassifyStandardizeStep:
          $ref: '#/components/schemas/SplitClassifyStandardizeStep'
          title: Split, Classify, and Standardize Step
          description: This step runs a split operation on the submitted document, then classifies each
            resulting sub-document, and finally standardizes any sub-document whose classification matches
            a provided class-to-schema mapping.
        workflowName:
          type: string
          title: Workflowname
          description: Optionally name your workflow
      type: object
      title: WorkflowOnSubmitDocumentRequest
    WorkflowPostResponse:
      properties:
        workflowId:
          type: string
          title: Workflowid
          description: The id of the workflow that was created. Call POST `/document` with this workflowId
            to run it
        success:
          type: boolean
          title: Success
          description: Whether the workflow was successfully created
      type: object
      required:
      - workflowId
      - success
      title: WorkflowPostResponse
    WorkflowResponse:
      properties:
        workflowId:
          type: string
          title: Workflow ID
          description: Unique identifier of the workflow.
        standardizeStep:
          $ref: '#/components/schemas/StandardizeStepOutput'
          title: Standardize Step Output
          description: Output of the standardize step, if applicable.
        splitStandardizeStep:
          $ref: '#/components/schemas/SplitStandardizeStepOutput'
          title: Split and Standardize Step Output
          description: Output of the split and standardize step, if applicable.
        splitClassifyStandardizeStep:
          $ref: '#/components/schemas/SplitClassifyStandardizeStepOutput'
          title: Split, Classify, and Standardize Step Output
          description: Output of the split, classify, and standardize step, if applicable.
        standardizeReviewStep:
          $ref: '#/components/schemas/StandardizeReviewStepOutput'
          title: Standardize and Review Step Output
          description: Output of the standardize and review step, if applicable.
        classifyStandardizeStep:
          $ref: '#/components/schemas/ClassifyStandardizeStepOutput'
          title: Classify and Standardize Step Output
          description: Output of the classify and standardize step, if applicable.
        errorMessage:
          type: string
          title: Error Message
          description: Error message if the workflow failed.
      type: object
      required:
      - workflowId
      title: WorkflowResponse
    WorkflowV2BlockResult:
      properties:
        blockId:
          type: string
          title: Blockid
          description: Node id this result belongs to.
        status:
          $ref: '#/components/schemas/WorkflowV2BlockStatus'
          description: Last known run status for this node.
        summary:
          type: string
          title: Summary
          description: Short result summary for the run panel.
        details:
          items:
            $ref: '#/components/schemas/WorkflowV2ResultDetail'
          type: array
          title: Details
          description: Optional structured result preview rows.
        stale:
          type: boolean
          title: Stale
          description: Whether this result should be re-run before downstream results are trusted.
      type: object
      required:
      - blockId
      - status
      - summary
      title: WorkflowV2BlockResult
    WorkflowV2BlockStatus:
      type: string
      enum:
      - idle
      - running
      - success
      - warning
      - error
      - timeout
      title: WorkflowV2BlockStatus
    WorkflowV2ReasoningOutput:
      properties:
        extractionId:
          type: string
          title: Extractionid
          description: Persisted reasoning extraction id.
        reasoning:
          type: string
          title: Reasoning
          description: Free-text reasoning result, if configured.
        records:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Records
          description: Structured reasoning records, if configured.
        recordsTooBig:
          type: boolean
          title: Recordstoobig
          description: True when the caller should fetch the extraction by id.
        sourceDocumentIds:
          items:
            type: string
          type: array
          title: Sourcedocumentids
          description: Source documents used as reasoning input.
        sourceStandardizationIds:
          items:
            type: string
          type: array
          title: Sourcestandardizationids
          description: Extraction results used as reasoning input.
      type: object
      title: WorkflowV2ReasoningOutput
    WorkflowV2RedactionOutput:
      properties:
        redactionIds:
          items:
            type: string
          type: array
          title: Redactionids
          description: Convenience list of created redaction ids.
        items:
          items:
            $ref: '#/components/schemas/WorkflowV2RedactionOutputItem'
          type: array
          title: Items
          description: One redacted-PDF result per source document.
      type: object
      title: WorkflowV2RedactionOutput
    WorkflowV2RedactionOutputItem:
      properties:
        documentId:
          type: string
          title: Documentid
          description: Source document for this redaction.
        redactedDocumentId:
          type: string
          title: Redacteddocumentid
          description: Flattened redacted document created by this run.
        redactedDocumentParseJobId:
          type: string
          title: Redacteddocumentparsejobid
          description: Parse job for the flattened redacted document.
        redactedDocumentParseStatus:
          $ref: '#/components/schemas/ProcessingStatus'
          title: Redacteddocumentparsestatus
          description: Parse status for the flattened redacted document.
        redactionId:
          type: string
          title: Redactionid
          description: Created redaction id.
        jobId:
          type: string
          title: Jobid
          description: Redaction job id.
        numRedactions:
          type: integer
          title: Numredactions
          description: Number of redaction boxes detected for this document.
        truncatedPages:
          items:
            type: integer
          type: array
          title: Truncatedpages
          description: Pages whose detections hit the per-page redaction limit.
        downloadUrl:
          type: string
          title: Downloadurl
          description: Authenticated API path that returns a presigned URL for the flattened redacted
            PDF.
      type: object
      required:
      - documentId
      - redactionId
      - numRedactions
      - downloadUrl
      title: WorkflowV2RedactionOutputItem
    WorkflowV2ResultDetail:
      properties:
        label:
          type: string
          title: Label
          description: Field or result label.
        value:
          type: string
          title: Value
          description: Field or result value.
        confidence:
          type: number
          title: Confidence
          description: Optional confidence score.
      type: object
      required:
      - label
      - value
      title: WorkflowV2ResultDetail
    WorkflowV2RunInput:
      properties:
        inputLabel:
          type: string
          title: Inputlabel
          description: Label of the workflow input this document belongs to (case-sensitive). Required
            when the workflow has multiple inputs; optional when it has exactly one (single document or
            stack), where every entry is assigned to that input. Repeat the same label across entries
            to add several documents to a stack input.
        documentId:
          type: string
          title: Documentid
          description: Reference an existing, fully processed workspace document. Provide exactly one
            of 'documentId' or 'document'.
        document:
          $ref: '#/components/schemas/InputDocument'
          title: Document
          description: Or upload a new document inline using url or base64 file; it is parsed before the
            workflow runs.
        pages:
          items:
            type: integer
          type: array
          title: Pages
          description: Inline-upload only. Zero-indexed pages to parse. Null/empty means all pages.
        dataset:
          type: string
          title: Dataset
          description: Inline-upload only. Dataset to assign the uploaded document to.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Inline-upload only. Optional metadata to associate with the document.
        parseVersion:
          type: number
          title: Parseversion
          description: Inline-upload only. Parsing version.
        processingMethod:
          $ref: '#/components/schemas/ProcessingMethod'
          title: Processingmethod
          description: Inline-upload only. Processing method.
      type: object
      title: WorkflowV2RunInput
    WorkflowV2RunInputResult:
      properties:
        inputLabel:
          type: string
          title: Inputlabel
          description: Input node label this document was bound to.
        documentId:
          type: string
          title: Documentid
          description: Resolved document id.
        uploadJobId:
          type: string
          title: Uploadjobid
          description: Parse job id for a fresh upload; null when referencing an existing doc.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
          description: Per-input processing status.
      type: object
      required:
      - inputLabel
      - documentId
      - status
      title: WorkflowV2RunInputResult
    WorkflowV2RunOutput:
      properties:
        outputType:
          type: string
          enum:
          - extraction
          - redaction
          - reasoning
          title: Outputtype
          description: Which payload field below is populated.
        label:
          type: string
          title: Label
          description: Output label/key from the output node.
        nodeId:
          type: string
          title: Nodeid
          description: Output node id.
        extraction:
          $ref: '#/components/schemas/WorkflowV2StandardizationOutput'
          title: Extraction
          description: Populated when outputType is 'extraction'.
        redaction:
          $ref: '#/components/schemas/WorkflowV2RedactionOutput'
          title: Redaction
          description: Populated when outputType is 'redaction'.
        reasoning:
          $ref: '#/components/schemas/WorkflowV2ReasoningOutput'
          title: Reasoning
          description: Populated when outputType is 'reasoning'.
      type: object
      required:
      - outputType
      - label
      - nodeId
      title: WorkflowV2RunOutput
    WorkflowV2RunRequest:
      properties:
        inputs:
          items:
            $ref: '#/components/schemas/WorkflowV2RunInput'
          type: array
          title: Inputs
          description: One entry per document. Every workflow input must receive at least one document;
            single-document inputs accept exactly one, stack inputs accept one or more (repeat the inputLabel).
            When the workflow has a single input, inputLabel can be omitted and all entries are assigned
            to it.
        timeout:
          type: integer
          title: Timeout
          description: Timeout in seconds for this workflow run.
      type: object
      required:
      - inputs
      title: WorkflowV2RunRequest
    WorkflowV2RunResponse:
      properties:
        workflowId:
          type: string
          title: Workflowid
          description: Workflow that was run.
        jobId:
          type: string
          title: Jobid
          description: WorkflowV2Job id for this run. Poll GET /job/{job_id}.
        status:
          $ref: '#/components/schemas/ProcessingStatus'
          description: Overall run status.
        inputs:
          items:
            $ref: '#/components/schemas/WorkflowV2RunInputResult'
          type: array
          title: Inputs
          description: Per-input resolution.
      type: object
      required:
      - workflowId
      - jobId
      - status
      - inputs
      title: WorkflowV2RunResponse
    WorkflowV2StandardizationOutput:
      properties:
        standardizationIds:
          items:
            type: string
          type: array
          title: Standardizationids
          description: Convenience list of created standardization ids.
        items:
          items:
            $ref: '#/components/schemas/WorkflowV2StandardizationOutputItem'
          type: array
          title: Items
          description: One item per source document.
      type: object
      title: WorkflowV2StandardizationOutput
    WorkflowV2StandardizationOutputItem:
      properties:
        documentId:
          type: string
          title: Documentid
          description: Source document for this extraction.
        standardizationId:
          type: string
          title: Standardizationid
          description: Created standardization id.
        data:
          additionalProperties: true
          type: object
          title: Data
          description: Extracted data when small enough to inline.
        dataTooBig:
          type: boolean
          title: Datatoobig
          description: True when the caller should fetch the standardization by id.
      type: object
      required:
      - documentId
      - standardizationId
      title: WorkflowV2StandardizationOutputItem
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    HTTPBearer:
      type: http
      scheme: bearer
servers:
- url: https://app.docupipe.ai
