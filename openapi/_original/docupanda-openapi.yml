    ClassifyStandardizeStep:
      properties:
        classIds:
          items:
            type: string
          type: array
          title: Classids
          description: The ids of the classes to classify the data to. If omitted or empty list, use all
            classes.
          examples:
          - - classId1
            - classId2
        multiClass:
          type: boolean
          title: Multi-Class
          description: Whether the classification is multi-class or not.
        includeUnknown:
          type: boolean
          title: Include Unknown
          description: Whether to include the 'unknown' class in the classification. Only relevant for
            if multiClass is false and classIds is not provided.
        instructions:
          type: string
          title: Instructions
          description: Instructions for the AI on how to classify the document.
        classToSchema:
          additionalProperties:
            type: string
          type: object
          title: Classtoschema
          description: A mapping of class ID to a schema that we should standardize into. Note that not
            every class must be mapped to a schema, if you do not wish to standardize certain classes.
            Any schemas mentioned will trigger a standardize action based on the schemaId provided.
          examples:
          - classId1: schemaId1
            classId2: schemaId2
        stdVersion:
          $ref: '#/components/schemas/StdVersion'
          title: Stdversion
          description: 'The version of the standardization engine. Supported values: [2.0, 2.1, 2.2, 2.3,
            3.0]. Use 3.0 for the V3 engine. This is the only version field you need to set.'
        stdReleaseVersion:
          $ref: '#/components/schemas/StdReleaseVersion'
          description: 'Deprecated - set `stdVersion` instead and this will be inferred automatically
            (e.g. `stdVersion=3.0` infers release 3). Kept for backwards compatibility. Supported values:
            [1, 2, 3].'
          deprecated: true
        guidelines:
          type: string
          title: Guidelines
          description: Guidelines for the AI on how to standardize the documents. If omitted, use the
            schema's guidelines.
        useMetadata:
          type: boolean
          title: Use Metadata
          description: Whether to use metadata during standardization.
        displayMode:
          $ref: '#/components/schemas/DisplayMode'
          title: Displaymode
          description: 'The display mode of the standardization. For V1, this is called `standardizationMode`.
            The options are: `auto`, `spatial`, `sections`.'
        splitMode:
          $ref: '#/components/schemas/SplitMode'
          title: Splitmode
          description: 'The split mode of the standardization. The options are: `auto`, `never`, `all`.'
        effortLevel:
          $ref: '#/components/schemas/EffortLevel'
          title: Effortlevel
          description: 'The effort level of the standardization. The options are: `standard`, `high`.'
        standardizeTimeout:
          type: integer
          title: Standardizetimeout
          description: The timeout in seconds for the standardization operation for webhook error reporting
        pages:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
          title: Pages
          description: Optional per-class page restriction, keyed by classId. Keys must be a subset of
            `classToSchema` keys. Values are non-empty lists of 0-indexed page numbers with no duplicates.
            Any classId not present in this dict standardizes the full document. Out-of-range pages are
            silently filtered out at execution time.
          examples:
          - classId1:
            - 0
            - 1
      type: object
      required:
      - classToSchema
      title: ClassifyStandardizeStep
    ClassifyStandardizeStepOutput:
      properties:
        classificationJobId:
          type: string
          title: Classification Job ID
          description: Job ID for the classification job.
        classToStandardizationIds:
          additionalProperties: true
          type: object
          title: Class to Standardization IDs
          description: Dictionary mapping class IDs to the standardization IDs that will be created for
            that class if the document is classified as that class.
        classToStandardizationJobIds:
          additionalProperties: true
          type: object
