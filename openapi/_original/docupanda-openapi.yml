openapi: 3.1.0
info:
  title: DocuPipe
  version: '1.0'
  x-source-url: https://docs.docupipe.ai/openapi/openapi.json
  x-documentation-url: https://docs.docupipe.ai/
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
paths:
  /:
    get:
      summary: Root
      operationId: root
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health Check
      description: Health check endpoint to confirm the service is operational.
      operationId: health_check
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      summary: Health Check Post
      description: Health check endpoint to confirm the service is operational.
      operationId: health_check_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /document:
    post:
      tags:
      - Document
      summary: Submit a Document for Processing
      description: 'Use this endpoint to submit a document to DocuPipe for processing. You can upload
        a local file or provide a URL to a remote file. Upon submission, receive a unique `documentId`
        which you may use to retrieve the document''s results, or apply subsequent workflows on it.


        Max document size is 3000 pages and 3000 MB. Max metadata size is 10KB.


        <Accordion title="Advanced Options" icon="fa-info-circle">You may also provide a `workflowId`
        to apply a pre-defined workflow to the document.</Accordion>'
      operationId: post_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDocumentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDocumentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document/upload/presigned-url:
    post:
      tags:
      - Document
      summary: Create Presigned Upload URL
      description: Create a short-lived presigned S3 PUT URL for browser uploads. Use the returned `contentType`
        header when uploading to `putUrl`, then submit `getUrl` to the document processing endpoint.
      operationId: create_presigned_upload_url
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document/{document_id}/proposed-schemas:
    get:
      summary: Get Schema Proposals
      operationId: get_proposed_schemas
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedSchemas'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Get schema proposals for a document by providing the document's ID. The schema proposals
        are generated by the AI based on the document's content.
      tags:
      - Document
  /document/{document_id}:
    get:
      summary: Retrieve a Processed Document
      operationId: get_document
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Access the analysis results of your submitted document using this endpoint. The `status`
        field indicates the document's current processing stage, and the `result` field provides the extracted
        plain text for AI comprehension, as well as more granular structured information such as bounding
        boxes for detected tables and text blocks.
      tags:
      - Document
    delete:
      summary: Delete a Document
      description: Delete a document that has been previously submitted to DocuPipe for processing.
      operationId: delete_document
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Document
  /document/{document_id}/detailed:
    get:
      summary: Retrieve Detailed Processing Result
      operationId: get_document_detailed
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDetailedDocumentParsing'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Access the fine grained document parsing result. This representation includes individual
        word locations on the page, as well as per-page handwriting detection. Available for PDF, image,
        Word, and HTML documents. Not available for table (xlsx/csv), text, or JSON documents.
      tags:
      - Document
  /document/{document_id}/download/original-url:
    get:
      summary: Download Original URL
      description: 'Generate and retrieve a presigned URL for accessing a document file by its ID. The
        URL is valid for a limited time (e.g., 1 hour) and allows secure access to the document stored
        on DocuPipe. outputFormat options: ''original'' (default) — returns the main file stored on DocuPipe.
        For documents that were converted during upload (HTML, Word, TIFF, WebP, XFA), this returns the
        converted version (PDF/PNG). ''pdf'' — same as original, but for image documents it additionally
        converts the image to PDF. ''uploaded'' — returns the actual file that was originally uploaded,
        before any conversion. Falls back to ''original'' behavior for older documents or documents where
        no conversion occurred.'
      operationId: download_original_url
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          description: Number of hours the URL should be valid for
          default: 6
          title: Hours
        description: Number of hours the URL should be valid for
      - name: format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OutputFormat'
          description: Output format of the document
          default: pdf
        description: Output format of the document
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      tags:
      - Document
  /document/{document_id}/download/ocr-url:
    get:
      summary: Download OCR URL
      description: Generate an OCR PDF by providing a document ID. This will add the OCR text into a layer
        on top of the PDF, allowing you to search the PDF by the OCR text. Returns a presigned URL to
        download the OCR PDF. This URL is valid for a limited time (e.g., 1 hour) and allows secure access
        to the OCR PDF stored on DocuPipe. Note that this endpoint only works for documents with PDF file
        types.
      operationId: download_ocr_url
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          description: Number of hours the URL should be valid for
          default: 6
          title: Hours
        description: Number of hours the URL should be valid for
      - name: skip_cache
        in: query
        required: false
        schema:
          type: boolean
          description: Force regeneration of the OCR PDF
          default: false
          title: Skip Cache
        description: Force regeneration of the OCR PDF
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      tags:
      - Document
  /document/{document_id}/download/public-url:
    get:
      summary: Download Public URL
      description: Generate a permanent public URL for a document by providing a document ID. This URL
        never expires and can be shared with anyone. The document is copied to a public S3 bucket and
        subsequent calls will return the same URL.
      operationId: download_public_url
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUrlResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      tags:
      - Document
  /document/download/bulk-original-url:
    post:
      tags:
      - Document
      summary: Bulk Download Original Documents
      description: Download multiple documents as their original files in a single zip archive. Provide
        a list of document IDs and receive a presigned URL to download a zip file containing all the original
        files. Maximum 100 documents per request. The download URL expires after 24 hours.
      operationId: bulk_original_download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOriginalDownloadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /document/download/bulk-ocr-url:
    post:
      tags:
      - Document
      summary: Bulk Download OCR PDFs
      description: Download multiple documents as OCR PDFs in a single zip archive. Provide a list of
        document IDs and receive a presigned URL to download a zip file containing all the OCR PDFs. Maximum
        100 documents per request. The download URL expires after 24 hours. Only PDF and image documents
        are supported.
      operationId: bulk_ocr_download
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOcrDownloadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /documents:
    get:
      summary: List Documents
      operationId: list_documents
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: dataset
        in: query
        required: false
        schema:
          type: string
          description: The dataset to filter documents by
          title: Dataset
        description: The dataset to filter documents by
      - name: from_timestamp
        in: query
        required: false
        schema:
          type: string
          description: Inclusive document creation timestamp lower bound, in ISO 8601 format
          title: From Timestamp
        description: Inclusive document creation timestamp lower bound, in ISO 8601 format
      - name: to_timestamp
        in: query
        required: false
        schema:
          type: string
          description: Inclusive document creation timestamp upper bound, in ISO 8601 format
          title: To Timestamp
        description: Inclusive document creation timestamp upper bound, in ISO 8601 format
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: The maximum number of documents to return. Maximum is 20000
          default: 20
          title: Limit
        description: The maximum number of documents to return. Maximum is 20000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          description: The number of documents to skip (to paginate through the dataset)
          default: 0
          title: Offset
        description: The number of documents to skip (to paginate through the dataset)
      - name: exclude_payload
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to exclude the result payload from the response
          default: true
          title: Exclude Payload
        description: Whether to exclude the result payload from the response
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
                title: Response List Documents Documents Get
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: List all documents that have been submitted to DocuPipe for processing. You can filter
        the results by providing a dataset name.
      tags:
      - Document
    delete:
      summary: Delete Multiple Documents
      description: Delete multiple documents that have been previously submitted to DocuPipe for processing.
        You can provide a list of document IDs to delete multiple documents at once.
      operationId: delete_documents
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDocumentsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Document
  /documents/search:
    get:
      summary: Search Documents
      description: Search documents by filename or document ID using case-insensitive partial matching.
        You can optionally filter results by dataset name.
      operationId: search_documents
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 50
          description: Search query to match against filename or document ID
          title: Query
        description: Search query to match against filename or document ID
      - name: dataset
        in: query
        required: false
        schema:
          type: string
          description: Optional dataset filter
          title: Dataset
        description: Optional dataset filter
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Maximum number of results to return (1-500)
          default: 100
          title: Limit
        description: Maximum number of results to return (1-500)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of results to skip for pagination
          default: 0
          title: Offset
        description: Number of results to skip for pagination
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
                title: Response Search Documents Documents Search Get
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Document
  /dataset-names:
    get:
      tags:
      - Document
      summary: List Dataset Names
      description: List all dataset names for the documents you have submitted so far
      operationId: list_datasets
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatasetsResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /documents/update-dataset:
    post:
      tags:
      - Document
      summary: Update Dataset
      description: Update the dataset of a list of documents by providing a list of document IDs and the
        new dataset name. This operation will update the dataset of all documents and standardizations
        associated with those documents.
      operationId: update_documents_dataset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDatasetResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /documents/update-metadata:
    post:
      tags:
      - Document
      summary: Update Document Metadata
      description: Replace the user-supplied metadata dict on one or more existing documents. The provided
        metadata fully replaces any existing metadata on each document. Pass an empty object to clear
        it. Metadata must be at most 10KB when JSON-serialized. Updates propagate to associated standardizations
        and reviews.
      operationId: update_documents_metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMetadataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /schema/autogenerate:
    post:
      tags:
      - Schema
      summary: AutoGenerate a Schema
      description: Generate a schema based on a list of documents. Leave the instructions empty if you
        want the AI to use its best judgment, or provide instructions to indicate your preference to how
        the schema should be generated. Best results are achieved when you provide a varied list of documents
        that represent the full range of type of documents you expect to process, and when you provide
        clear instructions to what you expect the schema to capture and how you want it to be structured.
      operationId: post_schema_autogenerate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGenerateSchemaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGenerateSchemaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /schema/{schema_id}:
    delete:
      summary: Delete a Schema
      description: Delete a schema by its id.
      operationId: delete_schema
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: schema_id
        in: path
        required: true
        schema:
          type: string
          title: Schema Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
