  /v2/standardize/batch:
    post:
      tags:
      - Standardization
      summary: Standardize V2 (Legacy)
      description: "Standardize a batch documents, either by passing a list of Document IDs or by passing\
        \ a dataset name. Pass a schemaId to standardize the documents using a specific structure, or\
        \ leave it empty to create an ad-hoc structure as the AI sees fit. Standardization handles lists\
        \ (arrays) by splitting documents into smaller sub-documents behind the scenes - the AI will do\
        \ its best to decide how and when it is appropriate to split.\n\n<Accordion title=\"Advanced Parameters\"\
        \ icon=\"fa-cog\">You can specify certain parameters, by default they are left to `auto` which\
        \ lets the AI decide.\n1. `displayMode` - Controls how the AI sees the document. The options are:\n\
        \   - `auto` - Automatically determine the best mode based on the document content.\n   - `spatial`\
        \ - Represent text in the document according to its spatial layout.\n   - `sections` - Represent\
        \ the document as a list of sections (paragraphs, tables, images, etc.) as seen in the web UX.\n\
        2. `splitMode` - Controls how the AI splits the document into sub-documents. The options are:\n\
        \   - `auto` - Automatically determine the best mode based on the document content.\n   - `all`\
        \ - Split the document into single-page sub-documents, so each page is handled separately.\n \
        \  - `never` - Do not split the document at all, so the entire document is handled as a single\
        \ unit. This can lead to poor performance for long documents, or documents with lots of dense\
        \ data that needs to be extracted.\n3. `effortLevel` - Controls how much effort the AI puts into\
        \ the standardization. The options are:\n   - `standard` - Use the standard effort level.\n  \
        \ - `high` - Use the high effort level, which takes longer but can produce better results. Costs\
        \ +2 credits per page.\n</Accordion>\n\n**Note:** The `guidelines` field has a maximum length\
        \ of 50,000 characters."
      operationId: post_standardize_batch_v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardizeV2BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardizeBatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
  /v3/standardize:
    post:
      tags:
      - Standardization
      summary: Standardize V3
      description: 'Standardize a single document using the V3 agentic engine. V3 uses an agentic architecture
        that automatically determines the optimal extraction strategy for each document - no manual configuration
        of display modes, split modes, or effort levels needed.


        Unlike V2, this endpoint processes a single document per call. To standardize multiple documents,
        fire parallel requests.


        If no `schemaId` is provided, a schema is first auto-generated from the document (same engine
        as `/schema/autogenerate`) and saved as a draft, then the document is standardized against it.
        The generated schema''s ID is returned in the response''s `schemaId` field. Schema generation
        costs schema credits in addition to the standardization credits.


        <Accordion title="Parameters" icon="fa-cog">- `schemaId` - Optional schema to standardize against.
        If omitted, a draft schema is auto-generated from the document.

        - `pages` - Optional list of 0-indexed page numbers to standardize. If not provided, the entire
        document is standardized.

        - `guidelines` - Optional extraction guidelines that override the schema''s default guidelines.

        - `useMetadata` - Whether to include document metadata during extraction (default: false).

        - `effortLevel` - `standard` (default) uses faster models, `high` uses the best models for better
        results at +2 credits per page.

        </Accordion>


        **Note:** The `guidelines` field has a maximum length of 50,000 characters.'
      operationId: post_standardize_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardizeV3Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardizeV3Response'
