      summary: Create a Workflow
      description: 'Use this endpoint to create a workflow that triggers when a document is submitted.


        The workflow can be configured to either:

        1. Always run the specified schema(s) on the document, set via the `standardizeStep`.

        2. Always run the specified schema(s) on the document, then follow up with a review step, set
        via the `standardizeReviewStep`.

        3. Split the document and standardize each resulting sub-document, set via the `splitStandardizeStep`.

        4. Conditionally run one or more schemas based on the document''s `classId`, set via the `classifyStandardizeStep`.

        5. Split the document, classify each resulting sub-document, and standardize based on class-to-schema
        mappings, set via the `splitClassifyStandardizeStep`.


        Note: You must provide exactly one of these inputs.


        To run the workflow, use the `POST /document` endpoint with the `workflowId` that gets returned
        from this endpoint. '
