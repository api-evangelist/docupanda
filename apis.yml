position: Consuming

description: DocuPipe (formerly DocuPanda, operated by Hoss Inc.) is an AI-powered document intelligence API that converts unstructured documents
  — invoices, leases, medical records, claims, contracts, bills of lading, receipts, and more — into structured JSON. The platform pairs an OCR
  + parsing pipeline with custom extraction schemas, an agentic standardization engine, classification, workflows, visual review, and webhooks.
  It publishes DocuBench, an open benchmark for schema-based extraction across 72 documents. DocuPipe lists SOC 2 Type 2 and ISO 27001, offers
  a HIPAA BAA, and deploys in cloud, VPC, or on-premises.

